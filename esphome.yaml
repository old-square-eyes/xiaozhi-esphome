substitutions:
  name: esphome-web-c0c120
  friendly_name: Touch-LCD-3.49

## Modular version Main v1.08 (Customized Single Device Fork)

## SETTINGS ######################################################################################################################################

  imagewidth:  "640"
  imageheight: "172"

  screenwidth:  "640"
  screenheight: "172"
  rotate_display: "90"

  startup_sound: "Home_Connected" # (options are: available, Home_Connected, Home_Connected_Male, Computer_Ready)
  clock_background_image: "waves" # (options are: clock, hacker, ha-girl, mission, starrysky, waves)
  imagemodel: "Sarah" # options are: Alfred, Gwen, Sarah, Jarvis

# USE ONLINE OR LOCAL MODEL AND WALLPAPER IMAGES, IMAGES SHOULD BE PLACED IN: homeassistant/www/images/
  imagepath: "https://github.com/old-square-eyes/xiaozhi-esphome/raw/main/images"
#  imagepath: "http://homeassistant.local:8123/local/images/"

## PRESENCE / MOTION SENSORS ########## IF NOT USING THESE LEAVE THEM ALONE, SCRIPT WILL BREAK WITHOUT ###########################################

  sensor1_entity: "binary_sensor.8266_presense_2_presence"
  light1_entity: "light.livingroom_all_lights"
  sensor1_label: "Tech Room"

  sensor2_entity: "binary_sensor.esp32s3_1_presence"
  light2_entity: "group.kitchen_lights"
  sensor2_label: "Kitchen"

  sensor3_entity: "binary_sensor.esphome_web_1911bf_presence"
  light3_entity: "light.mom_s_room"
  sensor3_label: "Living Room"

  sensor4_entity: "binary_sensor.notifier_2_presence"
  light4_entity: "light.hue_toilet_light_light"
  sensor4_label: "Toilet"

  sensor5_entity: "binary_sensor.8266_presense_presence"
  light5_entity: "switch.nedis_smart_plug_tasmota1"
  sensor5_label: "Hall"

  weather_entity: "weather.forecast_home"

# OPTIONAL URL REWRITING FOR TTS & FULLSCREEN IMAGES #############################################################################################
# Set these if Home Assistant generates external HTTPS / domain URLs that need rewriting to local HTTP for faster local playback.
  ha_domain: ""      # e.g. "ha.yourdomain.com" or !secret ha_domain
  ha_internal_ip: "" # e.g. "192.168.1.100" or !secret ha_internal_ip

##################################################################################################################################################

  font_glyphsets: "GF_Latin_Core"
  font_family: Figtree

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

### USE MODULES FROM GITHUB (Default) ############################################################################################################
packages:
  core:
    url: https://github.com/old-square-eyes/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - config/core.yaml
  hw:
    url: https://github.com/old-square-eyes/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - config/hw/waveshare_349_hw.yaml

### USE LOCAL MODULES (Requires copying config/ folder to /config/esphome/ on HAOS) #############################################################
#packages:
#  core: !include config/core.yaml
#  hw:   !include config/hw/waveshare_349_hw.yaml

## ENABLE / DISABLE WAKE WORDS ## IF LOW ON MEMORY, USE LESS WAKE WORDS ##########################################################################

micro_wake_word:
  id: mww
  models:
    - okay_nabu
    - hey_jarvis
    - alexa
#    - hey_mycroft
#    - model: https://raw.githubusercontent.com/old-square-eyes/xiaozhi-esphome/refs/heads/main/MicroWakeWords/models/v2/hey_sarah.json
#    - model: https://raw.githubusercontent.com/JohnnyPrimus/Custom_V2_MicroWakeWords/refs/heads/main/models/computer/computer.json
#    - model: https://raw.githubusercontent.com/JohnnyPrimus/Custom_V2_MicroWakeWords/refs/heads/main/models/hey_friday/hey_friday.json
#    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
#    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/refs/heads/main/microwakeword/models/v2/kenobi.json
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/choo_choo_homie.json
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/hey_home_assistant.json
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/hey_peppa_pig.json
